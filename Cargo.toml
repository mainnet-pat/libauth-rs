[package]
name = "libauth"
version = "3.1.0-next.8"
edition = "2021"
rust-version = "1.90"
description = "A Rust port of libauth v3.1.0-next.8"
license = "MIT"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/index.rs"

[dependencies]
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "expose-field", "precomputed-tables", "std"] }
ripemd = "0.1"
sha1 = { version = "0.10", features = ["compress"] }
sha2 = { version = "0.10", features = ["compress"] }

[dev-dependencies]
[build-dependencies]

[[bin]]
name = "vm-bench"
path = "tools/vm_bench.rs"

[[example]]
name = "dev-vmb-tests"
path = "src/lib/vmb-tests/dev-vmb-tests.spec.helper.rs"

[[example]]
name = "export-vmb-test-results"
path = "src/lib/vmb-tests/export-vmb-test-results.spec.helper.rs"

[[example]]
name = "run-live-bch-vmb-test"
path = "src/lib/vmb-tests/run-live-bch-vmb-test.spec.helper.rs"

[[example]]
name = "run-bch-vmb-test"
path = "src/lib/vmb-tests/run-bch-vmb-test.spec.helper.rs"

# Tests execute a WebAssembly interpreter; optimize test builds so the mandatory
# VMB suite is practical to run.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 2

# libauth's `*.spec.ts` files, ported as `*.spec.rs` beside them. Target names
# are the spec file stems with `.` replaced by `-`.
